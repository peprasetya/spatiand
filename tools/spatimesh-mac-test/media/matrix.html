<html><head><title>codec matrix</title></head><body style="background:#111;color:#eee;font:20px monospace">
<pre id=out></pre>
<script>
const files = (new URLSearchParams(location.search).get("f") || "").split(",").filter(Boolean);
if (!files.length) files.push(...["av1-aac.mp4","av1-only.webm","h264-aac.mp4","hevc-aac.mp4","vp9-opus.webm","av1-opus.mkv","h264-ac3.mkv","h264-aac.ts","hevc-aac.ts","mpeg2-mp2.ts","mpeg2-ac3.vob","divx-mp3.avi","h264-mp3.mp4","plain.mp3","h264-aac-srt.mkv"]);
const out = document.getElementById("out");
function one(f) {
  return new Promise(done => {
    const v = document.createElement("video");
    v.volume = 0.05; v.autoplay = true; v.width = 320; document.body.appendChild(v);
    let finished = false;
    const finish = (why) => {
      if (finished) return; finished = true;
      const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : {};
      const r = { file: f, why, t: +v.currentTime.toFixed(2), w: v.videoWidth, h: v.videoHeight,
                  frames: q.totalVideoFrames || 0, dropped: q.droppedVideoFrames || 0,
                  audio: v.webkitAudioDecodedByteCount || 0,
                  err: v.error ? v.error.code + " " + v.error.message : "" };
      console.log("[codec] " + JSON.stringify(r));
      out.textContent += JSON.stringify(r) + "\n";
      v.pause(); v.removeAttribute("src"); v.load(); v.remove(); done();
    };
    v.addEventListener("error", () => finish("error"));
    v.addEventListener("timeupdate", () => { if (v.currentTime > 3) finish("played"); });
    setTimeout(() => finish("timeout"), 12000);
    v.src = f;
  });
}
(async () => { for (const f of files) await one(f); console.log("[codec] done"); document.title = "codec matrix done"; })();
</script></body></html>
