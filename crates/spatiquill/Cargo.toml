[package]
name = "spatiquill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SpatiQuill: Spatiand's terminal"

# See docs/spatiand-apps.md. One process holds the windows; every tab is a process of its own
# (`spatiquill --tab`) holding the shell's terminal -- alacritty's emulator, a pseudo-terminal
# -- and telling the windows what is on its screen, so that one tab crashing takes nothing
# else with it.
[dependencies]
spatiand-app = { path = "../spatiand-app" }
log.workspace = true
env_logger.workspace = true
libc = "0.2"
alacritty_terminal = "0.26"
# The same text engine, and version, as the room's own (spatiand-render).
cosmic-text = "0.19"
