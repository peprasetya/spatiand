[package]
name = "spatimesh-webkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SpatiMesh's engine host on the Mac: WebKit (WKWebView)"

# A program of its own, started by SpatiMesh's window process, one per profile in use
# (docs/spatimesh.md); its native half is Objective-C against WebKit (native/webkit.m). Built
# anywhere, it does something only on a Mac.
[dependencies]
spatimesh = { path = "../spatimesh" }
spatimesh-shim = { path = "../spatimesh-shim" }

[build-dependencies]
cc = "1"
