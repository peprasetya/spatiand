<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SpatiMesh's fonts on a Mac (WPE finds fonts through fontconfig): macOS's own fonts, the user's,
  and a fallback that picks the right font for each script.
  * LastResort claims every character and draws only boxes: Khmer came out as boxes with
    Khmer MN installed. It is never a candidate.
  * Arial Unicode MS covers much and shapes Indic scripts badly (a Bengali cluster was not
    joined); macOS's own font for each script comes before it.
-->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">spatiand/fontconfig</cachedir>

  <selectfont>
    <rejectfont>
      <glob>/System/Library/Fonts/LastResort.otf</glob>
      <glob>/Library/Fonts/Arial Unicode.ttf</glob>
    </rejectfont>
  </selectfont>

  <!-- The old names, as Linux's own configuration has them: "Sans" is also what WebKit asks
       for as the system's UI font (form controls, the developer tools) when none is set. -->
  <alias binding="same"><family>Sans</family><accept><family>sans-serif</family></accept></alias>
  <alias binding="same"><family>Serif</family><accept><family>serif</family></accept></alias>
  <alias binding="same"><family>Monospace</family><accept><family>monospace</family></accept></alias>

  <alias><family>sans-serif</family><prefer>
    <family>Helvetica Neue</family><family>PingFang SC</family><family>Hiragino Sans</family>
    <family>Apple SD Gothic Neo</family><family>Thonburi</family><family>Kohinoor Devanagari</family>
    <family>Kohinoor Bangla</family><family>Tamil Sangam MN</family><family>Khmer Sangam MN</family>
    <family>Myanmar Sangam MN</family><family>Geeza Pro</family><family>Arial Hebrew</family>
    <family>Apple Color Emoji</family>
  </prefer></alias>
  <alias><family>serif</family><prefer>
    <family>Times</family><family>Songti SC</family><family>Hiragino Mincho ProN</family>
    <family>AppleMyungjo</family><family>Apple Color Emoji</family>
  </prefer></alias>
  <alias><family>monospace</family><prefer>
    <family>Menlo</family><family>PingFang SC</family><family>Apple Color Emoji</family>
  </prefer></alias>

  <!-- The script's own font first, by the language asked for. -->
  <match><test name="lang" compare="contains"><string>zh-tw</string></test><edit name="family" mode="prepend"><string>PingFang TC</string></edit></match>
  <match><test name="lang" compare="contains"><string>zh-hk</string></test><edit name="family" mode="prepend"><string>PingFang HK</string></edit></match>
  <match><test name="lang" compare="contains"><string>ja</string></test><edit name="family" mode="prepend"><string>Hiragino Sans</string></edit></match>
  <match><test name="lang" compare="contains"><string>ko</string></test><edit name="family" mode="prepend"><string>Apple SD Gothic Neo</string></edit></match>
  <match><test name="lang" compare="contains"><string>bn</string></test><edit name="family" mode="prepend"><string>Kohinoor Bangla</string></edit></match>
  <match><test name="lang" compare="contains"><string>km</string></test><edit name="family" mode="prepend"><string>Khmer Sangam MN</string></edit></match>
</fontconfig>
