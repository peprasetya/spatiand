[package]
name = "spatireel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SpatiReel: Spatiand's video player"

# The Vibrefy Rust port, moved into Spatiand and rebuilt on `spatiand-app` and
# `spatiand-media`: see docs/spatiand-apps.md. Local files first; servers after.
[dependencies]
spatiand-app = { path = "../spatiand-app" }
spatiand-media = { path = "../spatiand-media" }
# The Vibrefy server, as the port spoke to it.
vibrefy-api = { path = "../vibrefy-api" }
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
# The same client the Vibrefy crate uses, for Jellyfin, Emby and DLNA.
ureq = { version = "2", features = ["json"] }
# Posters, as servers send them.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# What a DLNA server says is XML.
roxmltree = "0.20"
