# Does it still build, on each of the three machines?
#
#   linux    the Deck's compositor and the crates around it, built and tested on Ubuntu (SteamOS is
#            x86-64 Linux; this is the same code, not the same machine).
#   android  the Beam Pro's library cross-compiled with the NDK, and then the APK itself.
#   mac      the Rust half and the Swift app, on a Mac runner.
#
# None of this runs on glasses or a device: it says the code compiles and its tests pass, not that
# it works. What a Deck, a Beam Pro and a pair of glasses do is still looked at by hand.
#
# `spatiand-host` is not built here: it links FFmpeg 8, which Ubuntu does not have; it is built on
# deepmagpie (docs/remote.md). The media crates bind FFmpeg 7.1, which Ubuntu has not got either:
# the linux job builds it once (tools/ci-deps.sh ffmpeg) and keeps it. The Mac's ANGLE comes from
# an installed Electron app and is not in the repository, so the Mac job builds the app but does
# not package or run it. SpatiMesh (docs/spatimesh.md) is built by all three.
name: ci

on:
  push:
    branches: [master, mac-compositor, spatiand-apps, spatiand-mesh]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg 7.1, if an earlier run built it
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: ~/ffmpeg-7.1
          key: ffmpeg-7.1.1-opus-ubuntu-24.04
      - run: tools/ci-deps.sh linux ffmpeg
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ffmpeg-7.1
          key: ffmpeg-7.1.1-opus-ubuntu-24.04
      - uses: Swatinem/rust-cache@v2
      - run: . ~/.spatiand-ci-env; . "$HOME/.cargo/env" 2>/dev/null; cargo check --workspace --exclude spatiand-host --exclude spatiand-android --locked
      - run: . ~/.spatiand-ci-env; . "$HOME/.cargo/env" 2>/dev/null; cargo test --workspace --exclude spatiand-host --exclude spatiand-android --locked
      # Real pages in WebKitGTK's own processes, drawn offscreen, typed into, crashed: they need
      # a display, which the step above has not got (and so skips them).
      - name: SpatiMesh's WebKitGTK engine, on a virtual display
        run: . ~/.spatiand-ci-env; . "$HOME/.cargo/env" 2>/dev/null; xvfb-run -a cargo test -p spatimesh-webkitgtk --locked
      # The compositor itself, drawing in software, runs SpatiMesh and WebKitGTK as it would in
      # the room; the window is photographed after each step and the photographs checked.
      - name: SpatiMesh in the compositor, end to end
        run: |
          . ~/.spatiand-ci-env; . "$HOME/.cargo/env" 2>/dev/null
          cargo build -p spatiand -p spatimesh -p spatimesh-webkitgtk --locked
          python3 -I tools/spatimesh-e2e.py target/debug target/spatimesh-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatimesh-e2e
          path: target/spatimesh-e2e
          if-no-files-found: ignore
      # SpatiMesh on SteamOS uses Steam's own Chromium (CEF); here, CEF's own build of the same
      # version stands in for it, laid out as Steam lays out its own.
      - name: CEF of the version Steam's Chromium is, if an earlier run fetched it
        id: cef
        uses: actions/cache/restore@v4
        with:
          path: ~/cef
          key: cef-chromium-126.0.6478.183-linux64-minimal-1
      - if: steps.cef.outputs.cache-hit != 'true'
        run: tools/fetch-cef.sh ~/cef
      - if: steps.cef.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/cef
          key: cef-chromium-126.0.6478.183-linux64-minimal-1
      - name: SpatiMesh's SteamOS engine, against that CEF, on a virtual display
        run: |
          . ~/.spatiand-ci-env; . "$HOME/.cargo/env" 2>/dev/null
          # No sandbox for the pages' processes here: the runner does not allow Chromium's.
          CEF_ROOT=$HOME/cef SPATIMESH_CEF_DIR=$HOME/cef/steam SPATIMESH_CEF_NO_SANDBOX=1 SPATIMESH_CEF_REQUIRED=1 \
            xvfb-run -a cargo test -p spatimesh-cef --locked

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci-deps.sh android
      - uses: Swatinem/rust-cache@v2
      - name: The library, for the Beam Pro
        run: |
          . ~/.spatiand-ci-env
          . "$HOME/.cargo/env" 2>/dev/null || true
          cd android
          xkbcommon/build.sh
          cd ../crates/spatiand-android
          RUSTFLAGS="-L native=$GITHUB_WORKSPACE/android/xkbcommon/out" \
            cargo ndk -t arm64-v8a -P 34 build --release
      - name: SpatiMesh, for the Beam Pro
        run: |
          . ~/.spatiand-ci-env
          . "$HOME/.cargo/env" 2>/dev/null || true
          RUSTFLAGS="-L native=$GITHUB_WORKSPACE/android/xkbcommon/out" \
            cargo ndk -t arm64-v8a -P 34 build --release -p spatimesh --locked
      - name: The app's Java, and SpatiMesh's Android engine speaking SpatiMesh's wire
        run: |
          . ~/.spatiand-ci-env
          android/libs/fetch.sh
          out=$(mktemp -d)
          javac --release 17 -Xlint:-options -Xlint:-deprecation \
            -classpath "$ANDROID_HOME/platforms/android-34/android.jar:$(ls android/libs/*.jar | tr '\n' ':')" \
            -d "$out/app" $(find android/src -name '*.java')
          javac --release 17 -d "$out/test" android/src/id/prasetya/spatiand/mesh/Wire.java android/test/WireTest.java
          java -cp "$out/test" WireTest
          javac --release 17 -d "$out/dnr" android/src/id/prasetya/spatiand/mesh/Dnr.java android/test/DnrTest.java
          java -cp "$out/dnr" id.prasetya.spatiand.mesh.DnrTest
      - name: The APK
        # android/build.sh was written on a Mac; this is its first run anywhere else, so it
        # reports and does not fail the build until it has been seen to work.
        continue-on-error: true
        run: |
          . ~/.spatiand-ci-env
          . "$HOME/.cargo/env" 2>/dev/null || true
          android/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatiand-apk
          path: android/spatiand.apk
          if-no-files-found: ignore

  mac:
    # 15: the room recorder writes its file with ScreenCaptureKit's SCRecordingOutput, which is
    # in the macOS 15 SDK and not 14's (the app still runs on 14; the recorder asks for 15).
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/spatiand-mac
      - name: libxkbcommon
        run: |
          brew install bison
          BISON="$(brew --prefix bison)/bin/bison" mac/xkbcommon/build.sh
      - name: The Rust half
        run: cd crates/spatiand-mac && MACOSX_DEPLOYMENT_TARGET=14.0 cargo build --locked
      - name: The app
        run: cd mac && swift build
      - name: SpatiMesh, and its WebKit engine
        run: MACOSX_DEPLOYMENT_TARGET=14.0 cargo build -p spatimesh -p spatimesh-webkit --locked
      # Real pages in WebKit's own processes (the runner's session has a window server): a Chrome
      # extension and a Firefox one, end to end (crates/spatimesh/tests/common).
      - name: SpatiMesh's WebKit engine, in the runner's own session
        run: SPATIMESH_WEBKIT_REQUIRED=1 MACOSX_DEPLOYMENT_TARGET=14.0 cargo test -p spatimesh-webkit --locked
      # What SpatiMesh's window does without an engine (the wire, its memory for pictures, the
      # extension runtime, the store) on the Mac's own system calls.
      - name: SpatiMesh's own tests, on the Mac
        run: MACOSX_DEPLOYMENT_TARGET=14.0 cargo test -p spatimesh --lib --locked
      - name: The shared crates' tests
        run: cargo test -p spatiand-shell -p spatiand-track -p spatiand-stream -p spatiand-mac-core --locked
