[package]
name = "spatishelf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SpatiShelf: Spatiand's file manager"

# See docs/spatiand-apps.md. One process holds the window; every tab is a process of its own
# (`spatishelf --tab`) that lists, makes pictures and copies, so that a folder that hangs or a
# file that crashes a decoder takes only its own tab. Remotes are the storage service's
# (`spatiand-storage`): places like any other, with nothing mounted.
[dependencies]
spatiand-app = { path = "../spatiand-app" }
spatiand-media = { path = "../spatiand-media" }
spatiand-storage = { path = "../spatiand-storage" }
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
# Folders on show listed again when anything changes them: inotify on Linux and Android,
# FSEvents on the Mac, behind one interface.
notify = "8.2"
# Applications' icons, which are SVG as often as not on Linux.
resvg = "0.50"

# Linux's "Open with": the room's own reading of an Exec line and of the icon theme.
[target.'cfg(not(any(target_os = "macos", target_os = "android")))'.dependencies]
spatiand-platform = { path = "../spatiand-platform" }

# The Mac's own pieces: Finder's trash, and Launch Services' applications for a file.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSFileManager", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSWorkspace"] }
