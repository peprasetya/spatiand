<!doctype html>
<meta charset="utf-8">
<title>SpatiMesh's relay</title>
<!--
  spatimesh.test.js loads this with webauthn.js in the page's world (the browser's own WebAuthn
  taken away first) and forms.js + cred-world.js in the isolated world "spatimesh-cred", as
  SpatiMesh does. The frame below is another origin (127.0.0.1 rather than localhost).
-->
<form id="login" action="#" onsubmit="event.preventDefault(); window.signedIn = (window.signedIn || 0) + 1;">
  <input id="username" name="username" autocomplete="username webauthn">
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button id="signin">Sign in</button>
</form>
<form id="signup" action="#" onsubmit="event.preventDefault(); window.signedUp = true;">
  <input id="new-user" name="email" type="email">
  <input id="new-password" name="new-password" type="password" autocomplete="new-password">
  <button id="create">Create account</button>
</form>
<iframe id="other" width="400" height="200"></iframe>
<script>
  // What a page's framework would hear of a fill.
  window.events = [];
  document.querySelectorAll('input').forEach(function (input) {
    ['input', 'change'].forEach(function (type) {
      input.addEventListener(type, function (ev) { window.events.push([type, ev.target.id, ev.target.value]); });
    });
  });
  document.getElementById('other').src = location.href.replace('//localhost:', '//127.0.0.1:').replace('spatimesh.html', 'spatimesh-frame.html');
</script>
