[package]
name = "spatiand-android"
description = "Spatiand on Android: the glasses, the tracker and the sphere, driven from the id.prasetya.spatiand app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `libspatiand.so`, which the app's `System.loadLibrary("spatiand")` finds.
name = "spatiand"
crate-type = ["cdylib"]

# Everything is Android-only. On any other target the library is empty, so a plain
# `cargo build` of the workspace still builds on the Mac and the Deck.
[target.'cfg(target_os = "android")'.dependencies]
spatiand-hmd = { path = "../spatiand-hmd" }
spatiand-track = { path = "../spatiand-track" }
spatiand-render = { path = "../spatiand-render" }
spatiand-stream = { path = "../spatiand-stream" }
# The same versions spatiand-stream links, for its link's types.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
serde.workspace = true
toml.workspace = true
glam.workspace = true
log.workspace = true
libc = "0.2"
jni-sys = "0.4"
# `media` for MediaCodec and AImageReader, `nativewindow` for AHardwareBuffer.
ndk-sys = { version = "0.6", features = ["media", "nativewindow"] }
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.16"
