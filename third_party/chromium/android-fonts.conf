<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SpatiMesh's Chromium on Android: Android's own fonts, through Chromium's own fontconfig, set up
  as a Linux desktop sets fontconfig up, so that its pages and its own UI look as they do on the
  Deck. Unpacked with Chromium's resources (android/build.sh) and written beside its cache when it
  starts (third_party/chromium/run-android.sh).

  It was WPE's file (third_party/wpe/android/fonts.conf, removed with WPE on 2026-11-10), which names Android's faces for the
  generic families and nothing else. A desktop's fontconfig does three things more, and Chromium
  leans on all three: a pattern naming no family is sans-serif, which is how Chromium's UI font is
  chosen with no toolkit to name one (without it, whatever face fontconfig ranked first); the
  families pages name, Arial, Times New Roman and Courier New, are the generic ones; and type is
  smoothed and hinted lightly, as the Deck's is. Order matters: an alias only reaches the aliases
  after it, so the names pages use come before the generic names they become.
-->
<fontconfig>
  <dir>/system/fonts</dir>
  <dir>/product/fonts</dir>
  <cachedir>CACHE</cachedir>

  <!-- The names pages ask for, as their generic families (fontconfig's 30-metric-aliases.conf,
       to the generic family rather than a metric clone, which Android has not got). -->
  <alias binding="same"><family>Arial</family><prefer><family>sans-serif</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>sans-serif</family></prefer></alias>
  <alias binding="same"><family>Liberation Sans</family><prefer><family>sans-serif</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>sans-serif</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>serif</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>serif</family></prefer></alias>
  <alias binding="same"><family>Liberation Serif</family><prefer><family>serif</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>serif</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>monospace</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>monospace</family></prefer></alias>
  <alias binding="same"><family>Liberation Mono</family><prefer><family>monospace</family></prefer></alias>
  <alias binding="same"><family>Sans</family><prefer><family>sans-serif</family></prefer></alias>

  <!-- A pattern naming no generic family is sans-serif (fontconfig's 49-sansserif.conf). -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>

  <!-- The generic names, to Android's own faces. -->
  <alias binding="same"><family>sans-serif</family><prefer><family>Roboto</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Droid Sans Mono</family><family>Cutive Mono</family></prefer></alias>
  <alias binding="same"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>

  <!-- Type smoothed and hinted lightly, with no colour fringes: as the Deck draws it. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
