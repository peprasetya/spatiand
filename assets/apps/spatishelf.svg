<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpatiShelf: two shelves of files">
  <!-- The ground and the three colours are assets/icons/spatiand.svg's, so the four read as
       one family with it. A stand-in until the icons are drawn properly. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#2f3358"/>
      <stop offset="0.5" stop-color="#15172e"/>
      <stop offset="1" stop-color="#08090f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16e6c0"/>
      <stop offset="0.45" stop-color="#37a6f7"/>
      <stop offset="1" stop-color="#8f6bf2"/>
    </linearGradient>
