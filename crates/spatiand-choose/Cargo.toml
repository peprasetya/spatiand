[package]
name = "spatiand-choose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Spatiand's file chooser: a window of the room that a program asks for files, a folder or a name to save under, in this machine or in the storage service's remotes"

# A program's file dialog in the room, the same on every platform: SpatiMesh's Chromium asks it
# (third_party/chromium/android-libc/0019). The remotes are the storage service's
# (spatiand-storage): fetched from and sent to, so that the program is given paths of this machine.
[dependencies]
spatiand-app = { path = "../spatiand-app" }
spatiand-storage = { path = "../spatiand-storage" }
log.workspace = true
env_logger.workspace = true
serde_json.workspace = true
libc = "0.2"
