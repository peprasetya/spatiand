<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpatiMesh: a globe drawn as a mesh">
  <!-- The ground and the three colours are assets/icons/spatiand.svg's, so the apps read as
       one family with it. A stand-in until the icons are drawn properly. -->
