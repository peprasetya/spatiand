[package]
name = "spatiand-mac-core"
description = "The link to a Spatiand host, behind a small C interface, for the Mac app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# A static library the Swift package links, and an rlib so the tests run.
crate-type = ["staticlib", "rlib"]

[dependencies]
spatiand-stream = { path = "../spatiand-stream" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
serde.workspace = true
serde_json = "1"
base64 = "0.22"
log.workspace = true
