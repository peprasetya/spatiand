[package]
name = "spatikey-core"
description = "SpatiKey's vault, its crypto, the request protocol and the service, shared by the Mac app, the room and the apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# All the cryptography but one: AEAD, HKDF, HMAC, SHA, P-256 ECDSA, random numbers. Already in
# every build through rustls, on the Mac, Linux and Android alike.
ring = "0.17"
# The recovery code's key derivation.
argon2 = { version = "0.6", default-features = false, features = ["alloc"], optional = true }
base64 = "0.23"
# Base32, for TOTP secrets and the recovery code.
data-encoding = "2"
# The public suffix list is written in Unicode and hosts arrive in punycode: its rules are
# turned into punycode once, as they are read. Already locked through url.
idna = "1"
zeroize = "1"
libc = "0.2"
# The pinned-certificate QUIC the rest of Spatiand speaks, for the Deck and the Beam Pro asking
# the Mac.
spatiand-stream = { path = "../spatiand-stream", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "macros"], optional = true }

[features]
default = ["service"]
# The service itself (the vault, its keys, the Mac's and the devices' network); without it, only
# what asking the service needs.
service = ["dep:argon2", "dep:spatiand-stream", "dep:quinn", "dep:rustls", "dep:tokio"]

[dev-dependencies]
env_logger.workspace = true
