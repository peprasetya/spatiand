    <rect x="386" y="308" width="92" height="156" rx="20" opacity="0.75"/>
    <rect x="502" y="248" width="92" height="216" rx="20"/>
    <rect x="232" y="476" width="560" height="36" rx="18" opacity="0.5"/>
    <rect x="320" y="560" width="92" height="176" rx="20" opacity="0.75"/>
    <rect x="436" y="540" width="92" height="196" rx="20"/>
    <rect x="590" y="600" width="164" height="136" rx="24" opacity="0.85"/>
    <rect x="232" y="748" width="560" height="36" rx="18" opacity="0.5"/>
  </g>
</svg>
